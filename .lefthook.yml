pre-commit:
  commands:
    lychee:
      run: lychee . --suggest --max-concurrency 32 --cache --format detailed --max-cache-age 7d
    md:
      glob: "*.md"
      run: uv run mdformat {staged_files}
    toc:
      # run: markdown-toc docs/make_a_module.md
      glob: "*.md"
      run: uv run markdown-toc {staged_files}
  scripts:
    "find_orphans.sh":
      runner: bash
    "link_generator.py":
      runner: uv run python

